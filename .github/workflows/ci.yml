name: CI

on:
  push:
    branches: [main, ci/quality-base]
  pull_request:

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: all jobs inherit read-only token unless overridden.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1 — lint-test
  # Runs ruff lint + format, then pytest with coverage gate.
  # Python 3.11 matches the project's .python-version file.
  # ─────────────────────────────────────────────────────────────────────────
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Cache uv dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: api/.venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('api/uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.11-

      - name: Install project and dev dependencies
        working-directory: api
        run: uv sync --group dev

      - name: ruff check
        working-directory: api
        run: .venv/bin/ruff check .

      - name: ruff format check
        working-directory: api
        run: .venv/bin/ruff format --check .

      - name: pytest with coverage
        working-directory: api
        # test_status.py starts a live uvicorn server — skip in CI
        # (it is tested locally; the module requires a real HTTP server).
        run: |
          .venv/bin/pytest tests/ \
            --ignore=tests/test_status.py \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=85

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 — test-postgres
  # DECISION: PostgreSQL CI is NOT included in this PR.
  #
  # Rationale: The application uses sqlite+aiosqlite exclusively.
  # - database.py uses create_async_engine(settings.database_url, ...)
  # - alembic/env.py uses async_engine_from_config() which also requires
  #   an async driver (asyncpg for PostgreSQL).
  # - asyncpg is not in pyproject.toml dependencies or uv.lock.
  # - No model or migration uses PostgreSQL-specific types/features.
  # - Alembic env.py reads DATABASE_URL from settings, so PostgreSQL could
  #   be wired up by setting DATABASE_URL=postgresql+asyncpg://... but doing
  #   so requires: (a) adding asyncpg, (b) verifying all migrations work
  #   against PostgreSQL dialect, (c) testing both paths.
  #
  # This is documented as a follow-up: add asyncpg, run migration smoke
  # tests against PostgreSQL 16, verify no SQLite-specific pragmas leak.
  # ─────────────────────────────────────────────────────────────────────────
  # test-postgres: (follow-up — see above rationale)

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3 — pip-audit
  # Audits the project's actual locked dependency set for known CVEs.
  # ─────────────────────────────────────────────────────────────────────────
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv and pip-audit
        run: pip install uv pip-audit

      - name: Export locked requirements
        working-directory: api
        run: uv export --group dev --no-hashes --format requirements-txt > /tmp/requirements.txt

      - name: Run pip-audit
        # Report vulnerable packages; fail the job if any are found.
        # Do NOT use continue-on-error to suppress findings.
        run: pip-audit -r /tmp/requirements.txt --progress-spinner off

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4 — gitleaks
  # Scans full Git history for secrets using a reviewed, pinned action.
  # fetch-depth: 0 is required to scan the entire commit history.
  # ─────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196b2b9a22  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required only for organisations using the paid plan.
          # For public repositories / personal use, it can be omitted.

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5 — frontend
  # Installs frontend dependencies using the existing lockfile and runs
  # the production build (tsc + vite build).
  # No test framework is present in the frontend — build verification only.
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          # Use the LTS version compatible with vite ^8, tsc ~6 and react ^19.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
