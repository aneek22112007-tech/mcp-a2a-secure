services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcpg_guard}
      POSTGRES_USER: ${POSTGRES_USER:-mcpg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - mcpg_pgdata:/var/lib/postgresql/data
    # PostgreSQL port is not exposed on the host by default for production security.
    # To connect directly from the host during local debugging, uncomment the port mapping:
    # ports:
    #   - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcpg_user} -d ${POSTGRES_DB:-mcpg_guard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - mcpg_net

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 64mb --maxmemory-policy noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - mcpg_net

  notes-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    volumes:
      - mcpg_notes:/notes
      - mcpg_shared:/shared
    command: >
      sh -c "chown -R 65534:65534 /notes /shared && find /notes /shared -type d -exec chmod 775 {} +"
    networks:
      - mcpg_net

  # api1 is defined before migrate and api2 so the YAML anchor exists.
  api1: &api-service
    build:
      context: ./api
      dockerfile: Dockerfile
    image: mcp-guard-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      notes-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mcpg_notes:/app/data/notes
      - mcpg_shared:/app/data/shared
      # Mounting /var/run/docker.sock gives the API container control over the
      # host Docker daemon (to launch ephemeral tool runner and upstream containers)
      # and therefore carries host-level security implications.
      - /var/run/docker.sock:/var/run/docker.sock
    environment: &api-env
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mcpg_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mcpg_guard}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8000"]}
      TOOL_PINNING_MODE: ${TOOL_PINNING_MODE:-enforce}
      INJECTION_GUARD_MODE: ${INJECTION_GUARD_MODE:-enforce}
      ENABLE_RETENTION_SCHEDULER: ${ENABLE_RETENTION_SCHEDULER:-true}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-30}
      RATE_LIMIT_REFILL_RATE_PER_SEC: ${RATE_LIMIT_REFILL_RATE_PER_SEC:-5.0}
      NOTES_DIR: /app/data/notes
      SANDBOX_NOTES_SOURCE: volume:mcpg_notes
      SANDBOX_MODE: ${SANDBOX_MODE:-docker}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-mcp-guard-tool-runner:local}
      SANDBOX_TIMEOUT_S: ${SANDBOX_TIMEOUT_S:-4}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-128m}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-0.5}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-64}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-none}
      SANDBOX_RUN_AS: ${SANDBOX_RUN_AS:-65534:65534}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-3}
      UPSTREAM_FS_ENABLED: "true"
      UPSTREAM_FS_IMAGE: ${UPSTREAM_FS_IMAGE:-mcp-guard-upstream-fs:2.2.0}
      UPSTREAM_FS_DIR: /app/data/shared
      UPSTREAM_FS_SOURCE: volume:mcpg_shared
      UPSTREAM_FS_TIMEOUT_S: ${UPSTREAM_FS_TIMEOUT_S:-30.0}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NOTES_AGENT_API_KEY: ${NOTES_AGENT_API_KEY:-}
      WORKER_NOTES_API_KEY: ${WORKER_NOTES_API_KEY:-}
      RUN_MIGRATIONS: "false"
      MULTI_INSTANCE: "true"
      INSTANCE_ID: api1
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@valkey:6379/0
      TRUSTED_PROXIES: '["172.30.57.10/32"]'
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mcpg_net

  migrate:
    <<: *api-service
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-env

  api2:
    <<: *api-service
    environment:
      <<: *api-env
      INSTANCE_ID: api2

  proxy:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    image: mcp-guard-proxy:local
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      SIGNIN_API_ORIGIN: ${SIGNIN_API_ORIGIN:-http://localhost:5001}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    networks:
      mcpg_net:
        ipv4_address: 172.30.57.10
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mcpg_pgdata:
    name: mcpg_pgdata
  mcpg_notes:
    name: mcpg_notes
  mcpg_shared:
    name: mcpg_shared

networks:
  mcpg_net:
    ipam:
      config:
        - subnet: 172.30.57.0/24
