[project]
name = "polaris"
version = "0.1.0"
description = "MCP server with secure notes tools for the mcp-a2a-secure platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.0",
    "mcp<2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
